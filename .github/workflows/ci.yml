name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned package manager
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Verify naming, types, lint, tests, and production builds
        run: npm run check
