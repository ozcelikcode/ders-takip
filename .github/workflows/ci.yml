name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned package manager
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Verify naming, types, lint, tests, and production builds
        run: npm run check
      - name: Install browser test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Verify isolated browser journeys
        run: npm run test:e2e
      - name: Measure isolated Lighthouse pages
        run: npm run test:lighthouse
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
            lighthouse-results/
          if-no-files-found: ignore
          retention-days: 7
