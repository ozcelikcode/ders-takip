<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Öğrenci, öğretmen, çalışan ve yazılımcılar için modern görev takip ve zaman yönetimi sistemi" />
  <meta name="application-name" content="" />
  <meta property="og:site_name" content="" />
  <meta name="keywords"
    content="görev takibi, zaman yönetimi, pomodoro, planlama, üretkenlik, çalışma, öğrenci, öğretmen" />
  <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
  <link rel="manifest" href="/api/settings/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#171717" />

  <title>Yükleniyor…</title>

  <!-- Only public branding is read before account authentication. -->
  <script>
    try {
      const settings = JSON.parse(localStorage.getItem('site-branding') || 'null');
      if (typeof settings?.siteName === 'string') document.title = settings.siteName;
      if (typeof settings?.siteDescription === 'string') document.querySelector('meta[name="description"]').setAttribute('content', settings.siteDescription);
      document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
    } catch { /* Public cache is optional. */ }
  </script>
  <!-- Start restoring the session while the scripts download; the app adopts this response (lib/initialSessionRefresh.ts).
       Same request and cross-tab lock as authAPI.refreshToken; skipped while a sign-out is still pending. -->
  <script>
    try {
      if (!localStorage.getItem('auth-logout-pending')) {
        const refresh = () => fetch('%VITE_API_BASE_URL%/auth/refresh-token', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'StudyTracker' },
          signal: typeof AbortSignal.timeout === 'function' ? AbortSignal.timeout(30000) : undefined,
        });
        window.initialSessionRefresh = navigator.locks ? navigator.locks.request('study-tracker-auth', refresh) : refresh();
        window.initialSessionRefresh.catch(() => undefined);
      }
    } catch { /* The app refreshes the session itself. */ }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
